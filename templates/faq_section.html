{% load static %}

<section class="faq-section">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="section-title text-center mb-5">
                    <h2>Frequently Asked Questions</h2>
                    <p>Find answers to common questions about our products and services</p>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <div class="accordion" id="faqAccordion">
                    {% for faq in faqs %}
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="heading{{ forloop.counter }}">
                            <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ forloop.counter }}" aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="collapse{{ forloop.counter }}">
                                {{ faq.question }}
                            </button>
                        </h2>
                        <div id="collapse{{ forloop.counter }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" aria-labelledby="heading{{ forloop.counter }}" data-bs-parent="#faqAccordion">
                            <div class="accordion-body">
                                {{ faq.answer|linebreaks }}
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
                
                <div class="text-center mt-5">
                    <a href="{% url 'faq_page' %}" class="btn btn-segritech" style="background: linear-gradient(45deg, #4CAF50, #66BB6A); border: none; color: white; padding: 15px 40px; border-radius: 50px; font-weight: 600; font-size: 16px; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);">
                        <i class="fas fa-question-circle me-2"></i>View More Questions
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
