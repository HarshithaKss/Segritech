{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Coming Soon | SegriTech</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #4CAF50;
            --accent-green: #66BB6A;
            --dark-bg: #111111;
            --text-color: #333333;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a1a 50%, var(--dark-bg) 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-green);
            border-radius: 50%;
            opacity: 0.7;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }
        
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .coming-soon-box {
            background: rgba(42, 42, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(76, 175, 80, 0.3);
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .coming-soon-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-green), var(--accent-green), var(--primary-green));
            animation: glow 2s infinite;
        }
        
        @keyframes glow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; box-shadow: 0 0 20px var(--accent-green); }
        }
        
        .coming-soon-title {
            color: #FFFFFF;
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #FFFFFF, var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            animation: titlePulse 3s infinite ease-in-out;
        }
        
        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.5rem;
            margin-bottom: 40px;
            font-weight: 500;
        }
        
        .meme-container {
            margin: 40px 0;
            position: relative;
        }
        
        .meme-gif {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .meme-gif:hover {
            transform: scale(1.05);
        }
        
        .description {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 30px 0;
        }
        
        .feature-preview {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 40px 0;
            gap: 20px;
        }
        
        .feature-item {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 15px;
            padding: 20px;
            flex: 1;
            min-width: 200px;
            transition: all 0.3s ease;
        }
        
        .feature-item:hover {
            background: rgba(76, 175, 80, 0.2);
            transform: translateY(-5px);
        }
        
        .feature-icon {
            font-size: 2.5rem;
            color: var(--accent-green);
            margin-bottom: 15px;
        }
        
        .feature-title {
            color: #FFFFFF;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .feature-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }
        
        .back-button {
            background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
            color: #FFFFFF;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }
        
        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(76, 175, 80, 0.4);
            color: #FFFFFF;
            text-decoration: none;
        }
        
        .emoji-rain {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            animation: emojiDrop 4s infinite linear;
        }
        
        @keyframes emojiDrop {
            0% { transform: translateX(-50%) translateY(-50px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(-50%) translateY(600px); opacity: 0; }
        }
        
        @media (max-width: 768px) {
            .coming-soon-box {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .coming-soon-title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .feature-preview {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Animated particles background -->
    <div class="particles"></div>
    
    <!-- Emoji rain -->
    <div class="emoji-rain" style="animation-delay: 0s;">🚀</div>
    <div class="emoji-rain" style="animation-delay: 1s; left: 40%;">🔬</div>
    <div class="emoji-rain" style="animation-delay: 2s; left: 60%;">🌱</div>
    <div class="emoji-rain" style="animation-delay: 3s; left: 30%;">🤖</div>
    <div class="emoji-rain" style="animation-delay: 4s; left: 70%;">✨</div>
    
    <div class="main-container">
        <div class="coming-soon-box">
            <h1 class="coming-soon-title">
                <i class="fas fa-rocket" style="margin-right: 20px;"></i>
                Coming Soon!
            </h1>
            
            <p class="subtitle">
                <i class="fas fa-tools" style="margin-right: 10px;"></i>
                We're cooking up something amazing! 🧑‍🍳
            </p>
            
            <div class="meme-container">
                <!-- Using a funny programming/tech meme GIF -->
                <img src="https://media.giphy.com/media/13HgwGsXF0aiGY/giphy.gif" 
                     alt="Funny programming meme" 
                     class="meme-gif">
            </div>
            
            <p class="description">
                Our engineers are working around the clock to bring you the most advanced agricultural exploration tools.
            </p>
            
            <a href="{% url 'home' %}" class="back-button">
                <i class="fas fa-home"></i>
                Back to Home
            </a>
        </div>
    </div>
    
    <script>
        // Create animated particles
        function createParticles() {
            const particlesContainer = document.querySelector('.particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Initialize particles when page loads
        document.addEventListener('DOMContentLoaded', createParticles);
        
        // Add some fun click effects
        document.querySelector('.meme-gif').addEventListener('click', function() {
            this.style.transform = 'rotate(360deg) scale(1.1)';
            setTimeout(() => {
                this.style.transform = 'rotate(0deg) scale(1)';
            }, 1000);
        });
        
        // Fun keyboard easter egg
        let konami = [];
        const konamiCode = [38, 38, 40, 40, 37, 39, 37, 39, 66, 65]; // ↑↑↓↓←→←→BA
        
        document.addEventListener('keydown', function(e) {
            konami.push(e.keyCode);
            if (konami.length > konamiCode.length) {
                konami.shift();
            }
            if (konami.join(',') === konamiCode.join(',')) {
                alert('🎉 Konami Code activated! You found the easter egg! 🥚');
                document.body.style.animation = 'rainbow 2s infinite';
            }
        });
        
        // Add rainbow animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes rainbow {
                0% { filter: hue-rotate(0deg); }
                25% { filter: hue-rotate(90deg); }
                50% { filter: hue-rotate(180deg); }
                75% { filter: hue-rotate(270deg); }
                100% { filter: hue-rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
