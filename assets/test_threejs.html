<!DOCTYPE html>
<html>
<head>
    <title>Three.js Test</title>
</head>
<body>
    <h1>Three.js Library Test</h1>
    <div id="status">Loading...</div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
    <script>
        console.log('Scripts loaded, checking...');
        console.log('THREE:', typeof THREE);
        
        window.addEventListener('load', function() {
            setTimeout(function() {
                console.log('After load:');
                console.log('THREE:', typeof THREE);
                console.log('THREE.GLTFLoader:', typeof THREE.GLTFLoader);
                console.log('THREE.OrbitControls:', typeof THREE.OrbitControls);
                
                let status = document.getElementById('status');
                if (typeof THREE !== 'undefined' && 
                    typeof THREE.GLTFLoader !== 'undefined' && 
                    typeof THREE.OrbitControls !== 'undefined') {
                    status.innerHTML = '<span style="color: green;">✓ All Three.js libraries loaded successfully!</span>';
                } else {
                    status.innerHTML = '<span style="color: red;">✗ Some libraries failed to load</span>';
                }
            }, 500);
        });
    </script>
</body>
</html>
